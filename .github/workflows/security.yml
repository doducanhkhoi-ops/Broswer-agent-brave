name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security & lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Lint with Ruff
        run: ruff check main.py server.py tests/

      - name: Static security scan with Bandit
        run: bandit -r main.py server.py -ll
